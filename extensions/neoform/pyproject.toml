[project]
name = "neoform-lab"
version = "0.2.0"
description = "An open-source evolutionary post-training lab powered by Tinker"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Krish Golcha" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "rich>=14,<15",
  "tinker>=0.27,<0.28",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
neoform = "neoform.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neoform"]

[tool.hatch.build.targets.wheel.force-include]
"src/neoform/datasets/arithmetic.jsonl" = "neoform/datasets/arithmetic.jsonl"
"src/neoform/datasets/gsm8k.jsonl" = "neoform/datasets/gsm8k.jsonl"
"src/neoform/datasets/instruction_following.jsonl" = "neoform/datasets/instruction_following.jsonl"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
tinker = { path = "../..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

